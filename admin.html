<!DOCTYPE html>

<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        WasteWorth Admin
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f7f3;
            color: #173b2b;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #159447;
        }

        button {
            border: none;
            cursor: pointer;
        }

        .logout {
            background: #e74c3c;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
            margin-bottom: 30px;
        }

        .stat {
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow:
                0 5px 20px rgba(0,0,0,.05);
        }

        .stat h2 {
            font-size: 35px;
            margin: 10px 0 0;
            color: #159447;
        }

        .table-card {
            background: white;
            padding: 25px;
            border-radius: 18px;
            overflow-x: auto;
        }

        .search {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #e9f7ed;
        }

        .hidden {
            display: none;
        }

        #adminMessage {
            padding: 20px;
            background: #ffe8e8;
            color: #c0392b;
            border-radius: 12px;
        }

        @media(max-width:700px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <header>

        <div>

            <h1>
                ♻️ WasteWorth Admin
            </h1>

            <p>
                ระบบจัดการผู้ใช้งาน
            </p>

        </div>


        <button
            id="logoutButton"
            class="logout"
        >
            Logout
        </button>

    </header>


    <div
        id="adminMessage"
        class="hidden"
    ></div>


    <div
        id="dashboard"
        class="hidden"
    >

        <div class="stats">

            <div class="stat">

                <p>
                    ผู้ใช้ทั้งหมด
                </p>

                <h2 id="totalUsers">
                    0
                </h2>

            </div>


            <div class="stat">

                <p>
                    ขวดทั้งหมด
                </p>

                <h2 id="totalBottles">
                    0
                </h2>

            </div>


            <div class="stat">

                <p>
                    คะแนนทั้งหมด
                </p>

                <h2 id="totalPoints">
                    0
                </h2>

            </div>

        </div>


        <div class="table-card">

            <h2>
                Users
            </h2>


            <input
                id="searchInput"
                class="search"
                placeholder="ค้นหา username หรือ email..."
            >


            <table>

                <thead>

                    <tr>

                        <th>
                            Username
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Bottles
                        </th>

                        <th>
                            Points
                        </th>

                        <th>
                            Money
                        </th>

                    </tr>

                </thead>


                <tbody id="usersTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script
    type="module"
    src="admin.js"
></script>

</body>

</html>
